name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --with dev
      - name: Lint
        run: poetry run ruff check src/
      - name: Format check
        run: poetry run ruff format --check src/
      - name: Type check
        run: poetry run mypy src/clinicai/
      - name: Tests
        run: poetry run pytest src/tests/ -v --cov=src/clinicai --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true
